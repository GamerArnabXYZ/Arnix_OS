name: Build Arnix OS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Android applicationId becomes com.gax.arnix_os
  FLUTTER_CREATE: flutter create --org com.gax --project-name arnix_os --platforms=android,windows,linux .

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: |
          $FLUTTER_CREATE
          rm -f test/widget_test.dart
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
        continue-on-error: true
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: |
          $FLUTTER_CREATE
          rm -f test/widget_test.dart
          bash tools/patch_android.sh
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: arnix-os-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  linux:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: |
          $FLUTTER_CREATE
          rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter build linux --release
      - run: tar -czf arnix-os-linux.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: arnix-os-linux
          path: arnix-os-linux.tar.gz

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        shell: bash
        run: |
          $FLUTTER_CREATE
          rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: arnix-os-windows
          path: build/windows/x64/runner/Release
